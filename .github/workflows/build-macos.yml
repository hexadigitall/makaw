name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run pod install + patch BoringSSL + build
        working-directory: macos
        run: |
          # Run flutter build once to generate Podfile and pods, then fail at build
          cd ..
          flutter build macos --release 2>&1 || true

          # Now patch the BoringSSL compiler flags in the Pods project
          PROJ="macos/Pods/Pods.xcodeproj/project.pbxproj"
          if [ -f "$PROJ" ]; then
            echo "Patching BoringSSL-GRPC compiler flags..."
            # Remove -GCC_WARN_INHIBIT_ALL_WARNINGS from COMPILER_FLAGS
            sed -i '' 's/ -GCC_WARN_INHIBIT_ALL_WARNINGS//g' "$PROJ"
            echo "Patch applied. Rebuilding..."
          else
            echo "Pods project not found, attempting direct build"
          fi

          # Rebuild (pod install already done, should just do xcodebuild)
          flutter build macos --release

      - name: Create macOS zip
        working-directory: build/macos/Build/Products/Release
        run: zip -r ${{ github.workspace }}/makaw-macos.zip Makaw.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: makaw-macos
          path: makaw-macos.zip

      - name: Upload macOS zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: makaw-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
