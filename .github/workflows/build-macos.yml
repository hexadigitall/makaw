name: Build macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Check Xcode versions
        run: |
          ls /Applications/Xcode*.app 2>/dev/null || echo "No Xcode apps found"
          xcodebuild -version

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Phase 1 - build to install pods
        run: flutter build macos --release || true

      - name: Patch BoringSSL and gRPC
        run: |
          PROJ="macos/Pods/Pods.xcodeproj/project.pbxproj"
          if [ -f "$PROJ" ]; then
            echo "=== Patching Pods project ==="
            # Remove BoringSSL -GCC_WARN_INHIBIT_ALL_WARNINGS (causes -G unsupported)
            sed -i '' 's/ -GCC_WARN_INHIBIT_ALL_WARNINGS//g' "$PROJ"
            # Disable treat-warnings-as-errors at project level
            sed -i '' 's/GCC_TREAT_WARNINGS_AS_ERRORS = YES;/GCC_TREAT_WARNINGS_AS_ERRORS = NO;/g' "$PROJ"
            sed -i '' 's/CLANG_WARN_TREAT_WARNINGS_AS_ERRORS = YES;/CLANG_WARN_TREAT_WARNINGS_AS_ERRORS = NO;/g' "$PROJ"
            # Suppress gRPC template warning in WARNING_CFLAGS
            sed -i '' 's/WARNING_CFLAGS = "/WARNING_CFLAGS = "-Wno-missing-template-arg-list-after-template-kw /g' "$PROJ"
            # Also patch OTHER_CFLAGS (both quoted and unquoted patterns)
            sed -i '' 's/OTHER_CFLAGS = "/OTHER_CFLAGS = "-Wno-missing-template-arg-list-after-template-kw /g' "$PROJ"
            sed -i '' 's/OTHER_CFLAGS = (/OTHER_CFLAGS = (-Wno-missing-template-arg-list-after-template-kw /g' "$PROJ"
          fi

          echo "=== Patching gRPC source directly ==="
          GRPC_HDR="macos/Pods/gRPC-Core/src/core/lib/promise/detail/basic_seq.h"
          if [ -f "$GRPC_HDR" ]; then
            # Add pragma at top to suppress the clang 16+ template warning
            sed -i '' '1i\
#pragma clang diagnostic push\
#pragma clang diagnostic ignored "-Wmissing-template-arg-list-after-template-kw"\
' "$GRPC_HDR"
            echo "#pragma clang diagnostic pop" >> "$GRPC_HDR"
            echo "Patched $GRPC_HDR"
          else
            echo "gRPC header not found at expected path"
          fi

          echo "=== Patching all xcconfig files ==="
          find macos/Pods/Target\ Support Files -name "*.xcconfig" -exec sh -c '
            if ! grep -q "Wno-missing-template-arg-list-after-template-kw" "$1" 2>/dev/null; then
              echo "OTHER_CFLAGS = \$(inherited) -Wno-missing-template-arg-list-after-template-kw" >> "$1"
              echo "Patched: $1"
            fi
          ' _ {} \; 2>/dev/null || true

          echo "=== All patches applied ==="

      - name: Phase 2 - rebuild
        run: flutter build macos --release

      - name: Create macOS zip
        working-directory: build/macos/Build/Products/Release
        run: zip -r "$GITHUB_WORKSPACE/makaw-macos.zip" Makaw.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: makaw-macos
          path: makaw-macos.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: makaw-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
