name: Build macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Check Xcode versions
        run: |
          ls /Applications/Xcode*.app 2>/dev/null || echo "No Xcode apps found"
          xcodebuild -version

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Phase 1 - build to install pods
        run: flutter build macos --release || true

      - name: Patch BoringSSL and gRPC
        run: |
          PROJ="macos/Pods/Pods.xcodeproj/project.pbxproj"
          if [ -f "$PROJ" ]; then
            echo "=== Patching Pods project ==="
            sed -i '' 's/ -GCC_WARN_INHIBIT_ALL_WARNINGS//g' "$PROJ"
            sed -i '' 's/GCC_TREAT_WARNINGS_AS_ERRORS = YES;/GCC_TREAT_WARNINGS_AS_ERRORS = NO;/g' "$PROJ"
            sed -i '' 's/CLANG_WARN_TREAT_WARNINGS_AS_ERRORS = YES;/CLANG_WARN_TREAT_WARNINGS_AS_ERRORS = NO;/g' "$PROJ"
          fi

          echo "=== Fixing gRPC source template keyword warning ==="
          find macos/Pods/gRPC-C++ -name "*.h" -o -name "*.cc" | while read f; do
            if grep -q "template CallSeqFactory" "$f" 2>/dev/null; then
              sed -i '' 's/Traits::template CallSeqFactory(/Traits::template CallSeqFactory<>(/g' "$f"
              echo "Fixed template CallSeqFactory in $f"
            fi
          done

          echo "=== Patching xcconfig files ==="
          XCFLAGS="-Wno-missing-template-arg-list-after-template-kw"
          find macos/Pods/Target\ Support Files -name "*.xcconfig" | while read f; do
            echo "OTHER_CFLAGS = \$(inherited) $XCFLAGS" >> "$f"
            echo "OTHER_CPLUSPLUSFLAGS = \$(inherited) $XCFLAGS" >> "$f"
          done

          echo "=== All patches applied ==="

      - name: Phase 2 - rebuild
        run: flutter build macos --release

      - name: Create macOS zip
        working-directory: build/macos/Build/Products/Release
        run: zip -r "$GITHUB_WORKSPACE/makaw-macos.zip" Makaw.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: makaw-macos
          path: makaw-macos.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: makaw-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
