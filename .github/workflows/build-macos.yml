name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS (phase 1: install pods + expect BoringSSL failure)
        run: flutter build macos --release 2>&1 || true

      - name: Patch BoringSSL-GRPC compiler flags
        run: |
          PROJ="macos/Pods/Pods.xcodeproj/project.pbxproj"
          if [ -f "$PROJ" ]; then
            echo "Patching BoringSSL-GRPC compiler flags..."
            sed -i '' 's/ -GCC_WARN_INHIBIT_ALL_WARNINGS//g' "$PROJ"
            echo "Patch applied."
          fi

      - name: Build macOS (phase 2: rebuild after patch)
        run: flutter build macos --release

      - name: Create macOS zip
        working-directory: build/macos/Build/Products/Release
        run: zip -r ${{ github.workspace }}/makaw-macos.zip Makaw.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: makaw-macos
          path: makaw-macos.zip

      - name: Upload macOS zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: makaw-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
