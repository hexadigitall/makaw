name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: |
          flutter config --enable-macos-desktop
          flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Patch BoringSSL-GRPC for Xcode 16+ compatibility
        run: |
          mkdir -p ~/.cocoapods/hooks
          cat > ~/.cocoapods/hooks/post_install.rb << 'RUBY'
          Pod::HooksManager.register('post_install', :after) do |installer|
            installer.pods_project.targets.each do |target|
              if target.name == 'BoringSSL-GRPC'
                target.source_build_phase.files.each do |file|
                  if file.settings && file.settings['COMPILER_FLAGS']
                    flags = file.settings['COMPILER_FLAGS'].split
                    flags.reject! { |flag| flag == '-GCC_WARN_INHIBIT_ALL_WARNINGS' }
                    file.settings['COMPILER_FLAGS'] = flags.join(' ')
                  end
                end
              end
            end
          end
          RUBY

      - name: Build macOS
        run: flutter build macos --release

      - name: Create macOS zip
        working-directory: build/macos/Build/Products/Release
        run: zip -r ${{ github.workspace }}/makaw-macos.zip Makaw.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: makaw-macos
          path: makaw-macos.zip

      - name: Upload macOS zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: makaw-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
