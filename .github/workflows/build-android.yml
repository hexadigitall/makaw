name: Build Android (APK + AAB)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/makaw-release.jks
            echo "Keystore decoded successfully"
          else
            echo "No keystore secret found, building unsigned"
          fi

      - name: Decode key.properties
        env:
          KEYPROPS_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$KEYPROPS_B64" ]; then
            echo "$KEYPROPS_B64" | base64 -d > android/key.properties
            echo "Key properties decoded successfully"
          else
            echo "No key properties secret found, building unsigned"
          fi

      - name: Build split APKs (per-ABI)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Rename APKs with proper branding
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | sed 's/.*: //' | sed 's/+.*//')
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            if [ -f "$f" ]; then
              ABI=$(echo "$f" | sed 's/app-//' | sed 's/-release.apk//')
              NEWNAME="makaw-${ABI}-v${VERSION}.apk"
              mv "$f" "$NEWNAME"
              echo "Renamed $f -> $NEWNAME"
            fi
          done
          cd "$GITHUB_WORKSPACE/build/app/outputs/bundle/release"
          if [ -f "app-release.aab" ]; then
            mv "app-release.aab" "makaw-v${VERSION}.aab"
            echo "Renamed app-release.aab -> makaw-v${VERSION}.aab"
          fi

      - name: Generate checksums
        run: |
          cd $GITHUB_WORKSPACE/build/app/outputs/flutter-apk
          find . -name "makaw-*.apk" -exec sha256sum {} \; > SHA256.txt
          cd $GITHUB_WORKSPACE/build/app/outputs/bundle/release
          if [ -f "makaw-*.aab" ]; then
            sha256sum makaw-*.aab >> $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/SHA256.txt
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: makaw-apks
          path: build/app/outputs/flutter-apk/makaw-*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: makaw-aab
          path: build/app/outputs/bundle/release/makaw-*.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Makaw ${{ github.ref_name }}"
          files: |
            build/app/outputs/flutter-apk/makaw-*.apk
            build/app/outputs/bundle/release/makaw-*.aab
            build/app/outputs/flutter-apk/SHA256.txt
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
