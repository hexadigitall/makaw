name: Build Web (PWA)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Ensure platform runners exist
        run: flutter create . --org com.hexadigitall --project-name makaw

      - name: Restore custom web files
        run: |
          cat > web/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
            <meta name="description" content="Makaw — Full-featured hybrid browser, code studio & creative platform">
            <meta name="theme-color" content="#1a1a2e">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
            <meta name="apple-mobile-web-app-title" content="Makaw">
            <link rel="manifest" href="manifest.json">
            <link rel="icon" type="image/png" href="favicon.png">
            <link rel="apple-touch-icon" href="icons/Icon-192.png">
            <title>Makaw</title>
            <style>
              body { margin: 0; background: #1a1a2e; overflow: hidden; }
              .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 16px; }
              .loading img { width: 72px; height: 72px; border-radius: 18px; animation: pulse 1.5s ease-in-out infinite; }
              .loading span { color: rgba(255,255,255,0.5); font-family: system-ui; font-size: 13px; letter-spacing: 2px; }
              @keyframes pulse { 0%,100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }
            </style>
          </head>
          <body>
            <div class="loading"><img src="favicon.png" alt="Makaw"><span>MAKAW</span></div>
            <script src="flutter_bootstrap.js" async></script>
          </body>
          </html>
          HTMLEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (PWA)
        run: flutter build web --release --web-renderer canvaskit

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: makaw-web
          path: build/web/

      - name: Deploy to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages

      - name: Add web artifact to release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: build/web
        run: zip -r ${{ github.workspace }}/makaw-web.zip .

      - name: Upload web zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: makaw-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
