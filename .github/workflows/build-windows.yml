name: Build Windows (MSIX + Exe)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows exe
        run: flutter build windows --release
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CXXFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"

      - name: Zip Windows release
        working-directory: build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath ${{ github.workspace }}/makaw-windows-x64.zip

      - name: Install msix for packaging
        run: dart pub add dev:msix --no-example

      - name: Create MSIX certificate
        if: env.MSIX_CERT_B64 != ''
        env:
          MSIX_CERT_B64: ${{ secrets.MSIX_CERT_BASE64 }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String("$env:MSIX_CERT_B64")
          [IO.File]::WriteAllBytes("$env:USERPROFILE\makaw-cert.pfx", $certBytes)

      - name: Package MSIX (signed)
        if: env.MSIX_CERT_B64 != ''
        env:
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
          MSIX_CERT_B64: ${{ secrets.MSIX_CERT_BASE64 }}
        shell: pwsh
        run: |
          dart run msix:create `
            --display-name "Makaw" `
            --publisher "CN=Hexadigitall" `
            --capabilities "internetClient,broadFileSystemAccess" `
            --certificate-path "$env:USERPROFILE\makaw-cert.pfx" `
            --certificate-password "$env:MSIX_CERT_PASSWORD"

      - name: Package MSIX (self-signed fallback)
        if: env.MSIX_CERT_B64 == ''
        shell: pwsh
        run: |
          dart run msix:create `
            --display-name "Makaw" `
            --publisher "CN=Hexadigitall" `
            --capabilities "internetClient,broadFileSystemAccess"

      - name: Rename MSIX
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path "build/windows/x64/runner/Release" -Filter "*.msix" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $msix) {
            $msix = Get-ChildItem -Path "." -Filter "Makaw.msix" -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          }
          if ($msix) {
            Copy-Item $msix.FullName "makaw.msix" -Force
            Write-Host "Renamed $($msix.Name) -> makaw.msix"
          } else {
            Write-Host "No MSIX found to rename"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: makaw-windows
          path: |
            makaw-windows-x64.zip
            makaw.msix

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            makaw-windows-x64.zip
            makaw.msix
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
