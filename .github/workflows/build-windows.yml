name: Build Windows (MSIX + Exe)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Ensure platform runners exist
        run: flutter create . --org com.hexadigitall --project-name makaw

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows exe
        run: flutter build windows --release

      - name: Zip Windows release
        working-directory: build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath ${{ github.workspace }}/makaw-windows-x64.zip

      - name: Create MSIX certificate
        if: env.MSIX_CERT_B64 != ''
        env:
          MSIX_CERT_B64: ${{ secrets.MSIX_CERT_BASE64 }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String("$env:MSIX_CERT_B64")
          [IO.File]::WriteAllBytes("$env:USERPROFILE\makaw-cert.pfx", $certBytes)

      - name: Package MSIX
        if: env.MSIX_CERT_B64 != ''
        env:
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
          MSIX_CERT_B64: ${{ secrets.MSIX_CERT_BASE64 }}
        shell: pwsh
        run: |
          dart run msix:create `
            --display-name "Makaw" `
            --publisher "CN=Hexadigitall" `
            --capabilities "internetClient" `
            --certificate-path "$env:USERPROFILE\makaw-cert.pfx" `
            --certificate-password "$env:MSIX_CERT_PASSWORD" `
            --output "makaw.msix"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: makaw-windows
          path: |
            makaw-windows-x64.zip
            makaw.msix

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            makaw-windows-x64.zip
            makaw.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
