<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Makaw — Full-featured hybrid browser, code studio & creative platform for Android, Windows, Linux, macOS & Web">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Makaw">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <title>Makaw</title>
  <style>
    body { margin: 0; background: #1a1a2e; overflow: hidden; }
    .loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 16px;
    }
    .loading img { width: 72px; height: 72px; border-radius: 18px; animation: pulse 1.5s ease-in-out infinite; }
    .loading span { color: rgba(255,255,255,0.5); font-family: system-ui; font-size: 13px; letter-spacing: 2px; }
    @keyframes pulse { 0%,100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }
  </style>
</head>
<body>
  <div class="loading">
    <img src="favicon.png" alt="Makaw">
    <span>MAKAW</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
