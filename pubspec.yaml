name: makaw
description: Makaw — Full-featured hybrid browser, code studio & creative platform
version: 1.0.46+46
publish_to: 'none'

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  git: ^2.2.1
  http: ^1.1.0
  dio: ^5.4.0
  path: ^1.8.3
  share_plus: ^7.2.1
  file_picker: ^8.0.0
  cloud_firestore: ^4.13.6
  firebase_core: ^2.24.2
  googleapis: ^12.0.0
  googleapis_auth: ^1.4.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  xterm: ^4.0.0
  flutter_pty: ^0.4.0
  dartssh2: ^2.9.2
  package_info_plus: ^8.0.0
  open_filex: ^4.4.0
  permission_handler: ^11.3.0
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.2
  google_generative_ai: ^0.4.7
  mobile_scanner: ^7.2.1
  video_player: ^2.9.0
  just_audio: ^0.9.39
  pdfrx: ^1.0.83
  flutter_epub_viewer: ^1.2.1
  webfeed: ^0.7.0
  flutter_video_thumbnail: ^0.0.2
  geolocator: ^11.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  archive: ^4.0.9
  universal_html: ^2.2.4
  web: ^1.0.0
  palette_generator: ^0.3.3+7

msix_config:
  display_name: Makaw
  publisher_display_name: Hexadigitall
  identity_name: com.hexadigitall.makaw
  publisher: CN=Hexadigitall
  msix_version: 1.0.4.0
  logo_path: assets/makaw_logo_transparent-correct.png
  capabilities:
    - internetClient
    - broadFileSystemAccess

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
  assets:
    - assets/makaw_logo_48.png
    - assets/makaw_logo_64.png
    - assets/makaw_logo_28.png
    - assets/js/mammoth.min.js

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/makaw_logo_transparent-correct.png"
  remove_alpha_ios: false
  windows:
    generate: true
    image_path: "assets/makaw_logo_transparent-correct.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/makaw_logo_transparent-correct.png"
    icon_size: 1024
  linux:
    generate: true
    image_path: "assets/makaw_logo_transparent-correct.png"
    icon_size: 512
    adaptive_icon_background: "#0F172A"
    adaptive_icon_foreground: "assets/makaw_logo_transparent-correct.png"

